name: hackathon_utp_el_comercio
description: "Conecta2, aplicación móvil vecinal accesible para Android y iPhone con Flutter, Supabase y SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  sqflite: ^2.4.1
  url_launcher: ^6.3.3
  path: ^1.9.1
  crypto: ^3.0.8
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  connectivity_plus: 7.3.1
  http: ^1.6.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/geography/peru_ubigeo_2026.json
