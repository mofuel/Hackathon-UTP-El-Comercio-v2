name: conecta2-dev
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: conecta2_dev
      POSTGRES_USER: conecta2
      POSTGRES_PASSWORD: conecta2_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U conecta2 -d conecta2_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
